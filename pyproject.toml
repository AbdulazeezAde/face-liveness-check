[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "face-liveness-check"
version = "0.1.0"
description = "Composable face liveness and identity-verification orchestration for Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Face Liveness Check contributors" }]
keywords = ["face-verification", "liveness", "anti-spoofing", "biometrics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=1.24", "platformdirs>=4.0"]

[project.scripts]
face-liveness-check = "face_liveness_check.cli:main"

[project.optional-dependencies]
opencv = ["opencv-python>=4.8"]
opencv-headless = ["opencv-python-headless>=4.8"]
onnx = ["onnxruntime>=1.17", "opencv-python-headless>=4.8"]
mediapipe = ["mediapipe>=0.10"]
documents = ["PyMuPDF>=1.24"]
evidence-local = ["cryptography>=42"]
evidence-s3 = ["boto3>=1.34"]
evidence = ["cryptography>=42", "boto3>=1.34"]
full = ["opencv-python>=4.8", "onnxruntime>=1.17", "mediapipe>=0.10", "PyMuPDF>=1.24"]
dev = ["pytest>=8", "pytest-cov>=6", "build>=1.2", "twine>=6.0", "ruff>=0.8", "mypy>=1.13", "cryptography>=42", "fastapi>=0.115", "httpx>=0.27", "python-multipart>=0.0.9"]

[project.urls]
Homepage = "https://github.com/AbdulazeezAde/face-liveness-check"
Repository = "https://github.com/AbdulazeezAde/face-liveness-check"

[tool.hatch.build.targets.wheel]
packages = ["src/face_liveness_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Keep this baseline intentional and stable across Ruff releases. More rule
# families can be adopted in focused cleanup changes rather than appearing as
# surprise CI failures when the unpinned tool updates.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src/face_liveness_check/evaluation.py", "src/face_liveness_check/evidence.py"]
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["boto3"]
ignore_missing_imports = true
